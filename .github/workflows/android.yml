name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned whisper.cpp
        run: git clone --depth 1 --branch v1.9.3 https://github.com/ggml-org/whisper.cpp whisper-src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python (OpenCL kernel embedding)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;30.0.16138531" "cmake;3.22.1"

      - name: Build + unit tests
        run: |
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-transcript-debug
          path: app/build/outputs/apk/debug/app-debug.apk
